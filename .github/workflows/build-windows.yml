name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Windows x64
        run: dotnet restore IPTVPlayer.Windows/IPTVPlayer.Windows.csproj -r win-x64

      - name: Publish Windows x64
        run: dotnet publish IPTVPlayer.Windows/IPTVPlayer.Windows.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-Windows-x64
          path: publish/
          if-no-files-found: error
